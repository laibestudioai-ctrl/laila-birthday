<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Cuento Mágico de Laila - Invitación 2º Cumpleaños</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Dancing+Script:wght@700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1518;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    #app-container {
      position: relative;
      width: 430px;
      height: 780px;
      max-width: 100vw;
      max-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #ffdbe6 0%, #fbc2d5 40%, #f4a2be 100%);
      box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 40px rgba(230, 82, 135, 0.3);
      border-radius: 28px;
      overflow: hidden;
    }

    @media (max-width: 480px) {
      #app-container {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }
    }

    /* Video canvas holding particle effects & smooth animation */
    #fxCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 25;
      pointer-events: none;
    }

    /* SCENE 1: THE ENVELOPE */
    #scene-envelope {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1.2s ease;
      z-index: 10;
      background: radial-gradient(circle at 50% 40%, #ffedf2 0%, #fad4e2 50%, #f4b8cf 100%);
    }

    .envelope-box {
      position: relative;
      width: 320px;
      height: 220px;
      background: #f7bfd3;
      border-radius: 14px;
      box-shadow: 0 15px 35px rgba(180, 70, 110, 0.35);
      overflow: visible;
    }

    .envelope-body {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #f9c7d9 0%, #f4b4cb 100%);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    /* Envelope bottom pocket folds */
    .envelope-pocket-left {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 110px 0 0 160px;
      border-color: transparent transparent transparent #f2a9c3;
    }
    .envelope-pocket-right {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 110px 160px 0 0;
      border-color: transparent #e89cb7 transparent transparent;
    }
    .envelope-pocket-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 0;
      border-style: solid;
      border-width: 0 160px 125px 160px;
      border-color: transparent transparent #f5b3cb transparent;
    }

    /* Flap */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 0;
      border-style: solid;
      border-width: 130px 160px 0 160px;
      border-color: #f7bed2 transparent transparent transparent;
      transform-origin: top center;
      transition: transform 1.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
      filter: drop-shadow(0 6px 6px rgba(170, 60, 95, 0.2));
    }

    .envelope-flap.open {
      transform: rotateX(180deg);
      z-index: 1;
      border-color: #f2a4bf transparent transparent transparent;
    }

    /* Golden Twine Cord & Silk Bow */
    .bow-container {
      position: absolute;
      top: 112px;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .bow-container.untied {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.4);
    }

    .bow-svg {
      width: 100px;
      height: 100px;
      filter: drop-shadow(0 4px 8px rgba(160, 45, 80, 0.3));
    }

    /* Butterflies pulling the cord */
    .puller-butterfly {
      position: absolute;
      width: 44px;
      height: 44px;
      z-index: 30;
      transition: all 2.2s cubic-bezier(0.25, 1, 0.5, 1);
      filter: drop-shadow(0 2px 8px rgba(255, 215, 0, 0.6));
    }

    #butterfly-left {
      top: -80px;
      left: -60px;
    }
    #butterfly-right {
      top: -90px;
      right: -60px;
    }

    /* SCENE 2: LAILA IN THE ENCHANTED FOREST */
    #scene-forest {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.08);
      transition: opacity 1.5s ease, transform 6s cubic-bezier(0.2, 0.8, 0.3, 1);
      z-index: 5;
      overflow: hidden;
      background: #f7bfd3;
    }

    #scene-forest.active {
      opacity: 1;
      transform: scale(1);
    }

    .forest-bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: brightness(1.03) contrast(1.02);
    }

    .forest-narrative-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 35px 22px 28px;
      background: linear-gradient(to top, rgba(235, 75, 130, 0.92) 0%, rgba(240, 110, 155, 0.78) 55%, transparent 100%);
      color: #fff;
      text-align: center;
      z-index: 10;
      transform: translateY(20px);
      opacity: 0;
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .forest-narrative-overlay.show {
      transform: translateY(0);
      opacity: 1;
    }

    .forest-tagline {
      font-family: 'Great Vibes', cursive;
      font-size: 44px;
      line-height: 1;
      margin-bottom: 6px;
      color: #fff;
      text-shadow: 0 2px 10px rgba(140, 20, 60, 0.5);
    }

    .forest-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffe6ef;
      margin-bottom: 6px;
    }

    .forest-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 14.5px;
      line-height: 1.4;
      color: #fff;
      max-width: 320px;
      margin: 0 auto;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* SCENE 3: PAPER INVITATION CARD */
    #scene-paper {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      transition: all 1.5s cubic-bezier(0.2, 0.8, 0.3, 1);
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 50%, rgba(255, 235, 242, 0.95) 0%, rgba(248, 195, 215, 0.95) 100%);
      backdrop-filter: blur(8px);
    }

    #scene-paper.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .paper-card-frame {
      position: relative;
      width: 90%;
      max-width: 340px;
      height: 80%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(180, 50, 95, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.6);
      transform: perspective(1000px) rotateY(-1deg);
      transition: transform 0.6s ease;
    }

    .paper-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .paper-card-shine {
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(115deg, transparent 0%, rgba(255, 255, 255, 0.45) 50%, transparent 100%);
      animation: shineSweep 4s infinite 2s;
      pointer-events: none;
    }

    @keyframes shineSweep {
      0% { left: -150%; }
      35% { left: 150%; }
      100% { left: 150%; }
    }

    /* Bottom Floating Action Bar */
    .controls-bar {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 50;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-magic {
      padding: 11px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #e6457a 0%, #c4295d 100%);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 15px rgba(200, 45, 95, 0.4);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-magic:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(200, 45, 95, 0.55);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.9);
      color: #b52a5c;
      border: 1px solid rgba(220, 100, 140, 0.3);
    }

    /* Progress Bar */
    .progress-bar-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      z-index: 60;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #ff94ba, #ffffff);
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>

    <!-- Interactive / Effect Canvas -->
    <canvas id="fxCanvas"></canvas>

    <!-- ACT 1: ENVELOPE -->
    <div id="scene-envelope">
      <div style="font-family: 'Playfair Display', serif; font-style: italic; font-size: 17px; color: #a83864; margin-bottom: 24px; text-shadow: 0 1px 2px rgba(255,255,255,0.8);">
        Una carta mágica para ti... ✨
      </div>

      <div class="envelope-box" id="envelopeBox">
        <div class="envelope-body">

        <!-- Flap -->
        <div class="envelope-flap" id="envelopeFlap"></div>

        <!-- Bow & Twine Ribbon -->
        <div class="bow-container" id="bowContainer">
          <svg class="bow-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

            <!-- Center knot with pearl -->

            <path d="M25 25 C40 5 50 20 35 30 C30 33 26 28 25 25 Z" fill="#ff99bb"/>
            <path d="M25 25 C35 35 45 45 35 48 C28 47 26 35 25 25 Z" fill="#fca5c3"/>
            <ellipse cx="25" cy="27" rx="2.5" ry="8" fill="#5c203b"/>

    <!-- ACT 2: LAILA IN THE FOREST -->
    <div id="scene-forest">
      <img src="public/img/laila_bosque_encantado.png" class="forest-bg-img" alt="Laila en el Bosque Encantado">
      
      <div class="forest-narrative-overlay" id="forestOverlay">
        <div class="forest-tagline">Laila</div>

          "Ven a pasar una maravillosa tarde de juegos y merienda juntos en el bosque encantado..."
        </div>

    <!-- ACT 3: PAPER INVITATION CARD -->
    <div id="scene-paper">
      <div class="paper-card-frame">
        <img src="public/img/invitacion_papel_laila.png" class="paper-card-img" alt="Invitación en Papel Oficial">

      <div style="margin-top: 14px; text-align: center; color: #8e2b53;">

    <!-- ACTION CONTROLS -->
    <div class="controls-bar">
      <button class="btn-magic" id="btnRestart">

      <a href="https://wa.me/?text=%F0%9F%8C%B8%20%C2%A1Laila%20celebra%20su%20segundo%20a%C3%B1ito!%20%F0%9F%8C%B8%0A%0AS%C3%A1bado%207%20Noviembre%20a%20las%2017:30%20h%20en%20El%20Parque%20de%20Beltr%C3%A1n.%20%C2%A1Te%20esperamos!%20%E2%9C%A8" target="_blank" class="btn-magic btn-secondary">

  <script>
    // Particle & Sound System
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resizeCanvas() {
      W = canvas.width = canvas.offsetWidth;
      H = canvas.height = canvas.offsetHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Audio synthesizer for fairytale bells & chimes
    let audioCtx = null;
    function playChime(freq = 880, delay = 0) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      setTimeout(() => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 1.3);
        } catch(e) {}
      }, delay);
    }

    function playFairySwirl() {
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00];
      notes.forEach((freq, idx) => {
        playChime(freq, idx * 120);
      });
    }

    // Particle classes (Glitter + Flying Butterflies)
    class Particle {
      constructor(x, y, vx, vy, color, size, life) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.size = size;
        this.life = life;
        this.maxLife = life;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.03; // gentle gravity
        this.life--;
      }
      draw() {
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class SwirlButterfly {
      constructor(x, y, angle, speed, color) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.radius = 10;
        this.radialSpeed = speed;
        this.angularSpeed = 0.08 + Math.random() * 0.05;
        this.color = color;
        this.size = 12 + Math.random() * 10;
        this.life = 140;
        this.wingPhase = Math.random() * Math.PI;
      }
      update() {
        this.angle += this.angularSpeed;
        this.radius += this.radialSpeed;
        this.x = W/2 + Math.cos(this.angle) * this.radius;
        this.y = H/2 + Math.sin(this.angle) * this.radius * 0.8;
        this.wingPhase += 0.35;
        this.life--;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle + Math.PI/2);
        const wingScale = Math.sin(this.wingPhase);
        ctx.fillStyle = this.color;
        // left wing
        ctx.beginPath();
        ctx.ellipse(-this.size/2 * wingScale, 0, this.size/2 * Math.abs(wingScale), this.size/2.5, 0, 0, Math.PI*2);
        ctx.fill();
        // right wing
        ctx.beginPath();
        ctx.ellipse(this.size/2 * wingScale, 0, this.size/2 * Math.abs(wingScale), this.size/2.5, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }

    let particles = [];
    let swirlButterflies = [];

    function animateParticles() {
      ctx.clearRect(0, 0, W, H);

      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      swirlButterflies = swirlButterflies.filter(b => b.life > 0);
      swirlButterflies.forEach(b => {
        b.update();
        b.draw();
      });

      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // TIMELINE ORCHESTRATION
    const TOTAL_DURATION = 19000; // 19 seconds
    let startTime = Date.now();
    let animRunning = true;

    function runStoryTimeline() {
      startTime = Date.now();
      animRunning = true;

      // Reset DOM elements
      const sceneEnvelope = document.getElementById('scene-envelope');
      const sceneForest = document.getElementById('scene-forest');
      const scenePaper = document.getElementById('scene-paper');
      const envelopeFlap = document.getElementById('envelopeFlap');
      const bowContainer = document.getElementById('bowContainer');
      const bLeft = document.getElementById('butterfly-left');
      const bRight = document.getElementById('butterfly-right');
      const forestOverlay = document.getElementById('forestOverlay');

      sceneEnvelope.style.opacity = '1';
      sceneEnvelope.style.pointerEvents = 'auto';
      sceneForest.classList.remove('active');
      forestOverlay.classList.remove('show');
      scenePaper.classList.remove('active');
      envelopeFlap.classList.remove('open');
      bowContainer.classList.remove('untied');

      bLeft.style.transform = 'translate(0, 0)';
      bRight.style.transform = 'translate(0, 0)';

      // --- T = 1.0s: The 2 butterflies fly in towards the knot ends ---
      setTimeout(() => {
        bLeft.style.transform = 'translate(80px, 140px)';
        bRight.style.transform = 'translate(-80px, 140px)';
        playChime(1046, 0);
        playChime(1318, 300);
      }, 1000);

      // --- T = 3.2s: Butterflies pull the cords outward and untie the bow ---
      setTimeout(() => {
        bLeft.style.transform = 'translate(10px, 90px) scale(1.15)';
        bRight.style.transform = 'translate(-10px, 90px) scale(1.15)';
        bowContainer.classList.add('untied');

        // Sparkle explosion at bow
        for (let i = 0; i < 40; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = 2 + Math.random() * 4;
          particles.push(new Particle(
            W/2, H/2 + 20,
            Math.cos(angle) * spd, Math.sin(angle) * spd,
            ['#ffd700', '#ff99bb', '#ffffff', '#ffb6c1'][Math.floor(Math.random()*4)],
            2 + Math.random() * 3,
            60 + Math.random() * 30
          ));
        }
        playFairySwirl();
      }, 3200);

      // --- T = 4.2s: Envelope flap opens upwards ---
      setTimeout(() => {
        envelopeFlap.classList.add('open');
        playChime(784, 100);
        playChime(1046, 300);
      }, 4200);

      // --- T = 5.2s: Whirlwind of butterflies and fairy dust bursts out of the envelope ---
      setTimeout(() => {
        playFairySwirl();
        const colors = ['#ff99bb', '#ffd77a', '#c299ff', '#99e6ff', '#ffffff'];
        for (let i = 0; i < 35; i++) {
          setTimeout(() => {
            swirlButterflies.push(new SwirlButterfly(
              W/2, H/2,
              Math.random() * Math.PI * 2,
              2.5 + Math.random() * 3.5,
              colors[Math.floor(Math.random() * colors.length)]
            ));
          }, i * 40);
        }
      }, 5200);

      // --- T = 7.0s: Transition to ACT 2 - Laila in the Forest ---
      setTimeout(() => {
        sceneEnvelope.style.opacity = '0';
        sceneEnvelope.style.pointerEvents = 'none';
        sceneForest.classList.add('active');
        playChime(523, 200);
        playChime(659, 400);
        playChime(784, 600);
        playChime(1046, 800);
      }, 7000);

      // --- T = 8.8s: Forest narrative overlay reveals with text ---
      setTimeout(() => {
        forestOverlay.classList.add('show');
      }, 8800);

      // --- T = 13.5s: Transition to ACT 3 - Paper Invitation Card ---
      setTimeout(() => {
        sceneForest.classList.remove('active');
        scenePaper.classList.add('active');
        playFairySwirl();

        // Celebration confetti
        for (let i = 0; i < 60; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = 3 + Math.random() * 5;
          particles.push(new Particle(
            W/2, H/2,
            Math.cos(angle) * spd, Math.sin(angle) * spd,
            ['#ffd700', '#ff69b4', '#ffb6c1', '#ffffff', '#e6e6fa'][Math.floor(Math.random()*5)],
            2 + Math.random() * 3.5,
            90 + Math.random() * 40
          ));
        }
      }, 13500);
    }

    // Progress bar ticker
    function updateProgress() {
      if (animRunning) {
        const elapsed = Date.now() - startTime;
        const pct = Math.min(100, (elapsed / TOTAL_DURATION) * 100);
        document.getElementById('progressBar').style.width = pct + '%';
        if (elapsed < TOTAL_DURATION) {
          requestAnimationFrame(updateProgress);
        }
      }
    }

    function startFullStory() {
      runStoryTimeline();
      updateProgress();
    }

    // Auto-start on load & setup restart button
    window.addEventListener('load', () => {
      startFullStory();
    });

    document.getElementById('btnRestart').addEventListener('click', () => {
      startFullStory();
    });

    // Touch/click sound unlock for mobile browsers
    document.body.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }, { once: true });
  </script>
</body>
</html>
